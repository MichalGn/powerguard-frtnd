# Przekierowanie na strone logowania, przy odsweżaniu (np. F5)
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Runtime env (no cache)
  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    try_files $uri =404;
  }

  # Angular SPA fallback (THIS FIXES REFRESH 404)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
