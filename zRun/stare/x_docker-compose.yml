name: ${COMPOSE_PROJECT_NAME}

services:
  frontend_service:
    image: powerguard-frtnd_image
    container_name: ${FRONTEND_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend_service
      - mosquitto
    environment:
      BACKEND: ${FRONTEND_BACKEND_URL}
    networks:
      - app_network

  backend_service:
    image: powerguard-bcknd_image
    container_name: ${BACKEND_CONTAINER_NAME}
    restart: unless-stopped

    depends_on:
      postgres_service:
        condition: service_healthy

    ports:
      - "${BACKEND_PORT}:8080"

    environment:
      POSTGRESQL_HOST: ${POSTGRESQL_HOST}
      POSTGRESQL_PORT: ${POSTGRESQL_PORT}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE}
      POSTGRESQL_USER: ${POSTGRESQL_USER}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      MQTT_BROKER: ${MQTT_BROKER}
      MQTT_PORT: ${MQTT_INTERNAL_PORT}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      JAVA_OPTS: ${JAVA_OPTS}
      TZ: ${TZ}

    volumes:
      - ./deployments:/opt/jboss/wildfly/standalone/deployments/
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

    networks:
      - app_network


  postgres_service:
    image: postgres:17
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DATABASE}
      TZ: ${TZ}

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

      # DATA DIRECTORY
      - ./pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - app_network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ${MOSQUITTO_CONTAINER_NAME}
    restart: always
    ports:
      - "${MQTT_IP}:${MQTT_PORT}:1883"
      - "${MQTT_IP}:${WEBSOCKET_PORT}:9001"

    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - app_network

networks:
  app_network:
    name: ${NETWORK_NAME}
    driver: bridge
